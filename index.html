<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tachaHP | Portfolio</title>
  <meta name="description" content="tachaHPのポートフォリオサイト（準備中）">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f6f3;
      color: #222;
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
      padding: 24px;
    }
    main { max-width: 480px; width: 100%; text-align: center; }
    .label {
      font-size: 12px;
      letter-spacing: 0.3em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { font-size: 32px; font-weight: 600; letter-spacing: 0.05em; }
    .role { margin-top: 8px; font-size: 14px; color: #666; }
    .line { width: 40px; height: 1px; background: #ccc; margin: 32px auto; }
    .message { font-size: 14px; line-height: 1.9; color: #555; }
    ul { list-style: none; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #222;
      text-decoration: none;
      font-size: 14px;
      transition: border-color .2s, transform .2s;
    }
    a:hover { border-color: #222; transform: translateY(-1px); }
    footer { margin-top: 48px; font-size: 11px; color: #aaa; }
  </style>
</head>
<body>
  <main>
    <p class="label">Coming soon</p>
    <h1>tachaHP</h1>

    <div class="line"></div>

    <p class="message">
      ポートフォリオサイトは現在準備中です。
    </p>
    <footer>&copy; tachaHP</footer>
  </main>
</body>
</html>
